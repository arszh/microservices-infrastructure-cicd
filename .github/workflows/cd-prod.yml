name: CD Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: Git SHA of this commit)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  K8S_NAMESPACE: production
  RELEASE_NAME: app-prod

jobs:
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${KUBE_CONFIG_PROD}" > ~/.kube/config
          chmod 600 ~/.kube/config
        env:
          KUBE_CONFIG_PROD: ${{ secrets.KUBE_CONFIG_PROD }}

      - name: Create namespace if not exists
        run: |
          kubectl get ns ${{ env.K8S_NAMESPACE }} ||           kubectl create ns ${{ env.K8S_NAMESPACE }}

      - name: Resolve image tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="${GITHUB_SHA}"
          fi
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Helm upgrade (production)
        run: |
          helm upgrade ${{ env.RELEASE_NAME }} ./deploy/helm/app             --install             --namespace ${{ env.K8S_NAMESPACE }}             --set global.image.registry=${{ env.REGISTRY }}             --set global.image.prefix=${{ env.IMAGE_PREFIX }}             --set global.image.tag=${{ steps.vars.outputs.image_tag }}             --set environment.name=production             --atomic             --wait --timeout 10m

      - name: Post-deploy smoke tests
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
        run: |
          chmod +x ./scripts/smoke-tests-prod.sh
          ./scripts/smoke-tests-prod.sh
